# .github/workflows/deploy.yml
name: Deploy Action Tracker to Dev

on:
  push:
    branches: [ develop ]
  workflow_dispatch:

env:
  AWS_REGION: eu-west-1

jobs:
  deploy:
    name: Deploy to Development
    runs-on: ubuntu-latest
    environment: 
      name: development
      url: https://actions-dev.engsnayl.com
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Build Lambda Functions
        run: |
          echo "Building Lambda deployment packages..."
          chmod +x scripts/build-lambdas.sh
          ./scripts/build-lambdas.sh

      - name: Deploy Lambda Functions
        run: |
          echo "Deploying Lambda functions..."
          
          # Deploy API Handler
          if [ -f "src/lambdas/api-handler/lambda-deployment.zip" ]; then
            aws lambda update-function-code \
              --function-name deliverycommand-dev-api-handler \
              --zip-file fileb://src/lambdas/api-handler/lambda-deployment.zip \
              --region ${{ env.AWS_REGION }}
            echo "✓ API Handler deployed"
          fi
          
          # Deploy JWT Authorizer
          if [ -f "src/lambdas/jwt-authorizer/lambda-deployment.zip" ]; then
            aws lambda update-function-code \
              --function-name deliverycommand-dev-jwt-authorizer \
              --zip-file fileb://src/lambdas/jwt-authorizer/lambda-deployment.zip \
              --region ${{ env.AWS_REGION }}
            echo "✓ JWT Authorizer deployed"
          fi
          
          # Deploy Document Review API
          if [ -f "src/lambdas/document-review-api/lambda-deployment.zip" ]; then
            aws lambda update-function-code \
              --function-name deliverycommand-dev-document-review-api \
              --zip-file fileb://src/lambdas/document-review-api/lambda-deployment.zip \
              --region ${{ env.AWS_REGION }}
            echo "✓ Document Review API deployed"
          fi

      - name: Build and Deploy Frontend
        run: |
          echo "Building frontend..."
          cd frontend
          npm ci
          npm run build
          
          echo "Deploying frontend to S3..."
          aws s3 sync dist/ s3://deliverycommand-dev-frontend-hhm6m50m --delete --quiet
          
          echo "Invalidating CloudFront cache..."
          aws cloudfront create-invalidation \
            --distribution-id ECIVTEJ5GHRSW \
            --paths "/*" \
            --no-cli-pager

      - name: Run Health Checks
        run: |
          echo "Waiting for deployment to settle..."
          sleep 30
          
          echo "Testing frontend..."
          frontend_health=$(curl -s -o /dev/null -w "%{http_code}" \
            "https://actions-dev.engsnayl.com" || echo "000")
          
          if [ "$frontend_health" = "200" ]; then
            echo "✓ Frontend health check passed"
          else
            echo "✗ Frontend health check failed (HTTP $frontend_health)"
            exit 1
          fi
          
          echo "Note: API health check skipped - requires authentication"

      - name: Deployment Summary
        run: |
          echo "Deployment completed successfully!"
          echo "Frontend: https://actions-dev.engsnayl.com"
          echo "API: https://x8dd7fpwf3.execute-api.eu-west-1.amazonaws.com/dev"
          echo "Lambda functions updated and frontend deployed."