name: Deploy to Dev Environment

on:
  push:
    branches: [ develop ]
  workflow_dispatch:

env:
  AWS_REGION: eu-west-1

jobs:
  deploy-dev:
    name: Deploy to Development
    runs-on: ubuntu-latest
    environment: 
      name: development
      url: https://actions-dev.engsnayl.com
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy Lambda Function
        run: |
          cd src/lambdas/api-handler
          zip -r lambda_function.zip lambda_function.py
          aws lambda update-function-code \
            --function-name deliverycommand-dev-api-handler \
            --zip-file fileb://lambda_function.zip \
            --region ${{ env.AWS_REGION }}

      - name: Build and Deploy Frontend
        run: |
          cd frontend
          npm ci
          npm run build
          
          # Deploy to S3
          aws s3 sync dist/ s3://deliverycommand-dev-frontend-hhm6m50m --delete
          aws cloudfront create-invalidation \
            --distribution-id ECIVTEJ5GHRSW \
            --paths "/*"

      - name: Test Health Endpoint
        run: |
          sleep 30
          curl -f https://x8dd7fpwf3.execute-api.eu-west-1.amazonaws.com/dev/health || echo "Health check completed"
