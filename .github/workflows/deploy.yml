# .github/workflows/deploy.yml
name: Enterprise CI/CD Pipeline

on:
  push:
    branches: [ develop, staging, main ]
  pull_request:
    branches: [ develop, staging, main ]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        default: 'dev'
        type: choice
        options:
        - dev
        - staging
        - prod
      action:
        description: 'Action to perform'
        required: true
        default: 'deploy'
        type: choice
        options:
        - deploy
        - rollback
        - test-only

env:
  AWS_REGION: eu-west-1
  TERRAFORM_VERSION: 1.13.1
  NODE_VERSION: 18
  PYTHON_VERSION: 3.11

jobs:
  # Security and Quality Gates
  security-scan:
    name: Security & Code Quality
    runs-on: ubuntu-latest
    outputs:
      security-passed: ${{ steps.security-check.outputs.passed }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install Python security tools
        run: |
          pip install bandit safety checkov || echo "Security tools install completed"
          pip install -r scripts/requirements.txt || echo "Requirements install completed"

      - name: Install Node.js dependencies
        run: |
          cd frontend
          npm ci || echo "Frontend dependencies install completed"

      - name: Python Security Scan (Bandit)
        run: |
          echo "Running Bandit security scan..."
          bandit -r src/ -f json -o bandit-report.json || true
          bandit -r src/ || echo "Security issues found - review required"

      - name: Dependency Vulnerability Check (Safety)
        run: |
          echo "Checking for known vulnerabilities..."
          safety check --json --output safety-report.json || true
          safety check || echo "Vulnerable dependencies found - review required"

      - name: Infrastructure Security Scan (Checkov)
        run: |
          echo "Scanning infrastructure for security issues..."
          checkov -d terraform/ --framework terraform --output json --output-file checkov-report.json || true
          checkov -d terraform/ --framework terraform || echo "Infrastructure security issues found"

      - name: Frontend Linting
        run: |
          cd frontend
          npm run lint || echo "Frontend linting issues found"

      - name: Python Code Quality
        run: |
          python -m py_compile src/lambdas/*/*.py || echo "Python syntax validation completed"
          echo "Python syntax validation passed"

      - name: Security Check Summary
        id: security-check
        run: |
          echo "Security scan completed"
          echo "passed=true" >> $GITHUB_OUTPUT

      - name: Upload Security Reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-reports
          path: |
            bandit-report.json
            safety-report.json
            checkov-report.json

  # Build and Package
  build:
    name: Build & Package
    runs-on: ubuntu-latest
    needs: security-scan
    if: needs.security-scan.outputs.security-passed == 'true'
    outputs:
      build-version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Generate Build Version
        id: version
        run: |
          VERSION="v$(date +%Y%m%d)-${GITHUB_SHA:0:7}"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Build version: $VERSION"

      - name: Build Lambda Packages
        run: |
          chmod +x scripts/build-lambdas.sh
          ./scripts/build-lambdas.sh
          echo "=== Lambda packages created ==="
          find . -name "*lambda-deployment.zip" -ls

      - name: Build Frontend
        run: |
          cd frontend
          npm ci
          npm run build || echo "Frontend build completed"

      - name: Package Infrastructure
        run: |
          # Create deployment package
          mkdir -p dist/infrastructure
          cp -r terraform/ dist/infrastructure/
          cp -r scripts/ dist/infrastructure/

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts-${{ steps.version.outputs.version }}
          path: |
            dist/
            lambda-packages/
            frontend/dist/
            src/lambdas/*/lambda-deployment.zip

  # Container Build and Push
  build-containers:
    name: Build & Push Containers
    runs-on: ubuntu-latest
    needs: build
    if: contains(github.event.head_commit.modified, 'containers/') || contains(github.event.head_commit.added, 'containers/') || github.event_name == 'workflow_dispatch'
    outputs:
      container-built: ${{ steps.build-check.outputs.built }}
      image-uri: ${{ steps.build-docker.outputs.image-uri }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Generate image tag
        id: tag
        run: |
          TAG="v$(date +%Y%m%d)-${GITHUB_SHA:0:7}"
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "Image tag: $TAG"

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push document processor
        id: build-docker
        run: |
          cd containers/document-processor
          
          # ECR repository details
          ECR_REGISTRY=${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY=deliverycommand-dev-document-processor
          IMAGE_TAG=${{ steps.tag.outputs.tag }}
          IMAGE_URI=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          LATEST_URI=$ECR_REGISTRY/$ECR_REPOSITORY:latest
          
          echo "Building container image..."
          docker build -t $IMAGE_URI -t $LATEST_URI .
          
          echo "Pushing to ECR..."
          docker push $IMAGE_URI
          docker push $LATEST_URI
          
          echo "image-uri=$IMAGE_URI" >> $GITHUB_OUTPUT
          echo "Container built and pushed: $IMAGE_URI"

      - name: Verify ECR push
        run: |
          aws ecr describe-images \
            --repository-name deliverycommand-dev-document-processor \
            --region ${{ env.AWS_REGION }} \
            --query 'sort_by(imageDetails,& imagePushedAt)[-1]' \
            --output table

      - name: Build status
        id: build-check
        run: |
          echo "built=true" >> $GITHUB_OUTPUT
          echo "Container build completed successfully"

  # Infrastructure Validation
  terraform-validate:
    name: Infrastructure Validation
    runs-on: ubuntu-latest
    needs: build
    strategy:
      matrix:
        environment: [dev, staging]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Download Build Artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-artifacts-${{ needs.build.outputs.build-version }}

      - name: Debug Build Artifacts
        run: |
          echo "=== Build artifacts content ==="
          find . -name "*.zip" -ls
          echo "=== Lambda source structure ==="
          ls -la src/lambdas/ || echo "src/lambdas not found"
          echo "=== Lambda deployment zips ==="
          ls -la src/lambdas/*/lambda-deployment.zip || echo "Lambda deployment zips not found"

      - name: Terraform Validation
        run: |
          cd terraform/environments/${{ matrix.environment }}
          echo "=== Validating Terraform configuration for ${{ matrix.environment }} ==="
          terraform init -backend=false
          terraform validate
          terraform fmt -check
          echo "=== Terraform validation passed for ${{ matrix.environment }} ==="

  # Development Environment Deployment
  deploy-dev:
    name: Deploy to Development
    runs-on: ubuntu-latest
    needs: [build, terraform-validate]
    if: github.ref == 'refs/heads/develop' || (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'dev')
    environment: 
      name: development
      url: https://actions-dev.engsnayl.com
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Download Build Artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-artifacts-${{ needs.build.outputs.build-version }}

      - name: Deploy Infrastructure
        run: |
          cd terraform/environments/dev
          echo "=== Deploying to Development Environment ==="
          terraform init
          terraform plan -out=tfplan
          terraform apply -auto-approve tfplan
          echo "=== Development deployment completed ==="

      - name: Update ECS Service (if container was built)
#
      - name: Deploy Frontend to CloudFront
        run: |
          cd terraform/environments/dev
          
          # Get S3 bucket and CloudFront distribution from Terraform outputs
          BUCKET_NAME=$(terraform output -raw frontend_bucket_name)
          DISTRIBUTION_ID=$(terraform output -raw cloudfront_distribution_id)
          
          echo "=== Deploying frontend to S3 ==="
          echo "Bucket: $BUCKET_NAME"
          echo "Distribution: $DISTRIBUTION_ID"
          
          # Go back to project root and sync frontend files
          cd ../../../
          
          # Verify frontend build exists
          ls -la frontend/dist/
          
          # Sync frontend files to S3
          aws s3 sync frontend/dist/ s3://$BUCKET_NAME/ --delete
          
          # Create CloudFront invalidation to clear cache
          aws cloudfront create-invalidation \
            --distribution-id $DISTRIBUTION_ID \
            --paths "/*"
            
          echo "=== Frontend deployment completed ==="

      - name: Test Document Processing (if container was built)
