# .github/workflows/terraform.yml
#
# What this does:
# ---------------
# This pipeline runs automatically whenever someone opens a Pull Request
# or pushes code to the main branch. It checks your Terraform code for:
#   1. Formatting issues (terraform fmt)
#   2. Syntax/config errors (terraform validate)
#   3. Security problems (tflint + checkov)
#   4. What would change in AWS (terraform plan) -- on PRs only
#
# On merge to main, it does NOT auto-apply. You deploy manually.
# This is a safety measure for a personal AWS account.

name: Terraform CI

on:
  pull_request:
    branches: [main]
    paths:
      - 'terraform/**'
      - '.github/workflows/terraform.yml'
  push:
    branches: [main]
    paths:
      - 'terraform/**'
      - '.github/workflows/terraform.yml'

# Cancel any in-progress runs for the same PR/branch
concurrency:
  group: terraform-${{ github.ref }}
  cancel-in-progress: true

env:
  AWS_REGION: eu-west-1
  TF_VERSION: "1.6.0"
  TFLINT_VERSION: "v0.50.3"

# These permissions are needed for the GitHub Actions OIDC token
# (if you later switch from access keys to OIDC for AWS auth)
permissions:
  contents: read
  pull-requests: write

jobs:
  # ─────────────────────────────────────────────
  # Job 1: Check formatting across ALL environments
  # ─────────────────────────────────────────────
  fmt:
    name: Terraform Format Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Check formatting
        run: terraform fmt -check -recursive terraform/
        # This fails if any .tf file isn't properly formatted.
        # Fix locally with: terraform fmt -recursive terraform/

  # ─────────────────────────────────────────────
  # Job 2: Lint with tflint (catches common mistakes)
  # ─────────────────────────────────────────────
  lint:
    name: TFLint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: ${{ env.TFLINT_VERSION }}

      - name: Init TFLint
        run: tflint --init
        working-directory: terraform/

      - name: Run TFLint on modules
        run: |
          echo "=== Linting Terraform modules ==="
          for dir in terraform/modules/*/; do
            echo "--- Checking $dir ---"
            tflint --chdir="$dir" || true
          done

      - name: Run TFLint on environments
        run: |
          echo "=== Linting Terraform environments ==="
          for dir in terraform/environments/*/; do
            echo "--- Checking $dir ---"
            tflint --chdir="$dir" || true
          done

  # ─────────────────────────────────────────────
  # Job 3: Security scan with checkov
  # ─────────────────────────────────────────────
  security:
    name: Checkov Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Checkov
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: terraform/
          framework: terraform
          # Soft fail so the pipeline doesn't block on every finding.
          # Review the output and fix what matters.
          soft_fail: true
          output_format: cli
          # Skip checks that don't apply to serverless/personal projects:
          #   CKV_AWS_144 = S3 cross-region replication (overkill for dev)
          #   CKV_AWS_145 = S3 KMS encryption (SSE-S3 is fine)
          #   CKV2_AWS_62 = S3 event notifications (not needed)
          skip_check: "CKV_AWS_144,CKV_AWS_145,CKV2_AWS_62"

  # ─────────────────────────────────────────────
  # Job 4: Validate + Plan for dev environment
  # ─────────────────────────────────────────────
  plan-dev:
    name: "Plan: Dev"
    runs-on: ubuntu-latest
    needs: [fmt]
    # Only run plan on pull requests (not on merge to main)
    if: github.event_name == 'pull_request'
    defaults:
      run:
        working-directory: terraform/environments/dev
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Init
        run: terraform init -input=false

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        id: plan
        run: terraform plan -var-file=dev.tfvars -input=false -no-color -out=tfplan
        continue-on-error: true

      - name: Comment Plan on PR
        uses: actions/github-script@v7
        if: github.event_name == 'pull_request'
        with:
          script: |
            const output = `### Terraform Plan: Dev Environment

            **Format Check:** ${{ needs.fmt.result == 'success' && 'Passed' || 'Failed' }}
            **Validation:** ${{ steps.plan.outcome == 'success' && 'Passed' || 'Failed' }}

            <details><summary>Show Plan Output</summary>

            \`\`\`
            ${{ steps.plan.outputs.stdout || steps.plan.outputs.stderr }}
            \`\`\`

            </details>

            *Pushed by: @${{ github.actor }}, Action: \`${{ github.event_name }}\`*`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output
            });

      - name: Plan Status
        if: steps.plan.outcome == 'failure'
        run: exit 1

  # ─────────────────────────────────────────────
  # Job 5: Validate prod config (no AWS needed - just syntax check)
  # ─────────────────────────────────────────────
  validate-prod:
    name: "Validate: Prod"
    runs-on: ubuntu-latest
    needs: [fmt]
    defaults:
      run:
        working-directory: terraform/environments/prod
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      # Prod uses local backend so no AWS creds needed for validate
      - name: Terraform Init
        run: terraform init -input=false -backend=false

      - name: Terraform Validate
        run: terraform validate
